name: Lucia Real Qwen Windows E2E

# Genuine local Qwen research is a separate acceptance gate: source quotes,
# independent native verification, and repeated unfamiliar-site completion.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Which public documentation research task?'
        required: true
        default: all
        type: choice
        options:
          - all
          - webdev
          - w3c
      repetitions:
        description: 'Independent trials per selected website'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'

permissions:
  contents: read

jobs:
  native-real-qwen:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build UI assets
        shell: pwsh
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build:css

      - name: Install upstream Microsoft Playwright WebView2 adapter
        shell: pwsh
        run: |
          npm ci --prefix tests/interop --no-audit --no-fund
          node --test tests/interop/playwright-interop-policy.test.cjs

      - name: Validate research harness and upstream adapter syntax
        shell: pwsh
        run: |
          node --check tests/e2e/lucia-unfamiliar-source-acceptance.cjs
          node --check tests/interop/playwright-native-shell.cjs
          python -m py_compile tests/e2e/check-lucia-compound-research.py tests/e2e/check-lucia-source-scope.py tests/e2e/check-lucia-verification-recheck.py

      - name: Build release Browsphere executable
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --jobs 2

      - name: Run genuine Qwen 3.5 through real Windows WebView2 on unfamiliar research sites
        shell: pwsh
        timeout-minutes: 70
        run: ./tests/e2e/run-lucia-real-qwen.ps1 -Model 'qwen3.5:0.8b' -Scenario '${{ inputs.scenario }}' -Repetitions ${{ inputs.repetitions }}

      - name: Preserve genuine research trial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lucia-Qwen-Research-Verification
          path: |
            logs/lucia-unfamiliar-reliability.json
            ${{ runner.temp }}/lucia-real-unfamiliar/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish non-sensitive run summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "Real Qwen Windows E2E result is the conclusion of the previous step."
          Write-Host "Fixtures and model are local to this ephemeral runner; no API keys are used."
          Write-Host "A green deterministic model CI run alone does not certify Qwen/browser reliability."