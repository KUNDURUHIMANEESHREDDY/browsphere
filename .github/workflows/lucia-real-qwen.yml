name: Lucia Real Qwen Windows E2E

# Genuine local Qwen research is a separate acceptance gate: source quotes,
# independent native verification, and repeated unfamiliar-site completion.
on:
  # Temporary acceptance branch only. An ordinary CI push does not
  # trigger a multi-gigabyte real-model pull on main or other PRs.
  push:
    branches:
      - feature/browsphere-runtime-security-model-gates-20261127
      - feature/lucia-upstream-action-observability-20261127
      - feature/browsphere-upstream-full-integration-20261127
      - fix/lucia-qwen-upstream-ollama-action-budget-20261127
      - feature/lucia-stagehand-upstream-action-readback-20261127
      - integration/all-prs-20261127
    paths:
      - '.github/workflows/lucia-real-qwen.yml'
      - 'src-tauri/src/router/model_router.rs'
      - 'src-tauri/src/agent/loop_runner.rs'
      - 'src-tauri/src/agent/deliberation.rs'
      - 'src-tauri/src/agent/semantic_core.rs'
      - 'src-tauri/src/agent/requirements.rs'
      - 'tests/e2e/run-lucia-real-qwen.ps1'
      - 'tests/e2e/run-lucia-unfamiliar-hosted.ps1'
      - 'tests/e2e/lucia-unfamiliar-source-acceptance.cjs'
  workflow_dispatch:
    inputs:
      unfamiliar_sites:
        description: "Use genuine Qwen for three source-verified runs each on web.dev and W3C"
        required: false
        default: false
        type: boolean
      scenario:
        description: 'Which public documentation research task?'
        required: true
        default: all
        type: choice
        options:
          - all
          - webdev
          - w3c
      repetitions:
        description: 'Independent trials per selected website'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-real-qwen:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Cache the verified compiler outputs even if the later real-Qwen
          # acceptance gate fails; otherwise every failure recompiles Windows.
          cache-on-failure: true

      - name: Build UI assets
        shell: pwsh
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build:css

      - name: Install pinned upstream Playwright for native real-site checks
        shell: pwsh
        run: |
          npm ci --prefix tests/interop --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pinned Playwright CDP test library' }
          npm test --prefix tests/interop
          if ($LASTEXITCODE -ne 0) { throw 'Playwright loopback-only safety checks failed' }

      - name: Validate genuine-Qwen acceptance scripts
        shell: pwsh
        run: |
          node --check tests/e2e/lucia-unfamiliar-source-acceptance.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Real-Qwen JS acceptance syntax failed' }
          foreach ($path in @('tests/e2e/run-lucia-real-qwen.ps1','tests/e2e/run-lucia-unfamiliar-hosted.ps1')) {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ("PowerShell syntax invalid in " + $path + ": " + ($errors | Select-Object -First 1).Message) }
          }

      - name: Build release Browsphere executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release

      - name: Run actual Qwen 3.5 0.8B through native Windows WebView2
        shell: pwsh
        timeout-minutes: 30
        run: |
          if ($env:GITHUB_REF -eq 'refs/heads/fix/lucia-qwen-upstream-ollama-action-budget-20261127' -and
              '${{ github.event_name }}' -eq 'push') {
            # Per-change evidence: ONE trial on each unfamiliar site. Even if
            # both pass, this is not the six-run release acceptance gate.
            ./tests/e2e/run-lucia-real-qwen.ps1 -UnfamiliarSites -Scenario all -Repetitions 1
          } elseif ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.unfamiliar_sites }}' -eq 'true') {
            # The limited diagnostic must honor the requested site and repeat count;
            # one site trial cannot be reported as full 6/6 acceptance.
            ./tests/e2e/run-lucia-real-qwen.ps1 -UnfamiliarSites -Scenario '${{ inputs.scenario }}' -Repetitions ([int]'${{ inputs.repetitions }}')
          } elseif ('${{ github.event_name }}' -eq 'push') {
            ./tests/e2e/run-lucia-real-qwen.ps1 -UnfamiliarSites -Scenario all -Repetitions 3
          } else {
            ./tests/e2e/run-lucia-real-qwen.ps1
          }

      - name: Upload unfamiliar-site acceptance report (including failures)
        if: always() && (github.event_name == 'push' || inputs.unfamiliar_sites)
        uses: actions/upload-artifact@v4
        with:
          name: Lucia-Unfamiliar-Real-Qwen
          path: ${{ runner.temp }}/lucia-unfamiliar-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload bounded real-model diagnostic logs
        if: always() && (github.event_name == 'push' || inputs.unfamiliar_sites)
        uses: actions/upload-artifact@v4
        with:
          name: Lucia-Real-Qwen-Diagnostic-Logs
          path: ${{ runner.temp }}/lucia-real-unfamiliar/unfamiliar-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish non-sensitive run summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "Real Qwen Windows E2E result is the conclusion of the previous step."
          Write-Host "Fixtures and model are local to this ephemeral runner; no API keys are used."
          Write-Host "A green deterministic model CI run alone does not certify Qwen/browser reliability."