name: Signed Windows installer release

# This is deliberately manual and separate from unsigned CI builds.
# Requires a protected "windows-release" GitHub Environment with configured
# WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD secrets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must equal v + src-tauri/tauri.conf.json version)"
        type: string
        required: true
      publish_release:
        description: "Publish a GitHub release after successful Authenticode verification"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  signed-installer:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: windows-release
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release metadata and signing secrets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'The release tag must use the form v0.1.0.'
          }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne ('v' + $config.version)) {
            throw 'Release tag must match the app version declared in Tauri configuration.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw 'Authenticode signing secrets are not configured. An unsigned installer will NOT be published.'
          }
          if ($env:PFX_BASE64.Length -lt 256) {
            throw 'PFX certificate payload looks invalid.'
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build UI and run JavaScript checks
        shell: pwsh
        run: |
          npm ci --prefix ui --no-audit --no-fund
          npm --prefix ui run build:css
          node --check ui/public/src/browser-shell.js
          node --check ui/public/src/site-controls.js
          node --check ui/public/src/tauri-bridge.js
          node tests/browser-state.test.cjs

      - name: Rust regression tests
        run: cargo test --workspace --locked

      - name: Prepare trusted Windows signing in Tauri's native bundler
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Tauri's native certificateThumbprint option signs the application
          # executable DURING packaging, before it is placed inside NSIS.
          # Signing the outer setup.exe afterwards is not sufficient.
          $pfx = Join-Path $env:RUNNER_TEMP 'browsphere-signing-temporary.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $pass = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation 'Cert:\CurrentUser\My' -Password $pass -ErrorAction Stop
            if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'Certificate lacks a signing private key.' }
            $signingEku = @($cert.EnhancedKeyUsageList | Where-Object {
              $_.ObjectId -eq '1.3.6.1.5.5.7.3.3'
            })
            if ($signingEku.Count -ne 1) { throw 'Certificate is not explicitly a code-signing certificate.' }
            if ($cert.NotAfter -le (Get-Date).AddDays(1) -or $cert.NotBefore -gt (Get-Date)) {
              throw 'Certificate is expired, not yet valid, or expires within a day.'
            }
            $thumbprint = $cert.Thumbprint.Trim().ToUpperInvariant()
            if ($thumbprint -notmatch '^[0-9A-F]{40}$') { throw 'Invalid signer thumbprint.' }
            $overlay = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $thumbprint
                  digestAlgorithm = 'sha256'
                  timestampUrl = 'http://timestamp.digicert.com'
                  tsp = $true
                  allowDowngrades = $false
                }
              }
            }
            $overlay | ConvertTo-Json -Depth 8 |
              Set-Content -LiteralPath 'src-tauri/tauri.signing.release.conf.json' -Encoding UTF8
            "BROWSPHERE_SIGNER_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'Native Tauri signing overlay and trusted code-signing certificate prepared.'
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows NSIS setup executable with embedded signed app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
          args: --bundles nsis --config ${{ github.workspace }}/src-tauri/tauri.signing.release.conf.json

      - name: Verify both Authenticode layers and fresh installed binary
        id: signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:BROWSPHERE_SIGNER_THUMBPRINT
          if ($expected -notmatch '^[0-9A-F]{40}$') { throw 'Trusted signer thumbprint missing.' }
          $kitRoot = Join-Path "${env:ProgramFiles(x86)}" 'Windows Kits\10\bin'
          $signTool = Get-ChildItem $kitRoot -Recurse -Filter signtool.exe -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw 'Windows SDK signtool.exe was not found.' }
          function Assert-TrustedSignature([string]$file) {
            $sig = Get-AuthenticodeSignature -FilePath $file -ErrorAction Stop
            if ($sig.Status -ne 'Valid' -or $null -eq $sig.SignerCertificate) {
              throw "Code-signing verification failed for $([IO.Path]::GetFileName($file)): $($sig.Status)"
            }
            if ($sig.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expected) {
              throw "Wrong code-signing certificate for $([IO.Path]::GetFileName($file))"
            }
            & $signTool verify /pa $file
            if ($LASTEXITCODE -ne 0) { throw 'Independent signtool Authenticode verification failed.' }
          }
          $appExe = Join-Path 'target/release' 'browsphere-core.exe'
          if (-not (Test-Path -LiteralPath $appExe)) { throw 'Release app executable missing.' }
          Assert-TrustedSignature $appExe
          $installers = @(Get-ChildItem 'target/release/bundle/nsis' -Filter '*-setup.exe' -File -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $installer = $installers[0]
          Assert-TrustedSignature $installer.FullName

          # Validate that NSIS actually contains the SIGNED executable; an
          # Authenticode-signed wrapper can otherwise contain an unsigned app.
          $installRoot = Join-Path $env:RUNNER_TEMP 'browsphere-signed-release-audit'
          if ($installRoot.Contains(' ') -or (Test-Path -LiteralPath $installRoot)) {
            throw 'Refusing an ambiguous or pre-existing release audit directory.'
          }
          $audit = Start-Process -FilePath $installer.FullName -ArgumentList @('/S',"/D=$installRoot") -PassThru -Wait
          if ($audit.ExitCode -ne 0) { throw 'Signed NSIS installation failed.' }
          $installed = @(Get-ChildItem -LiteralPath $installRoot -Recurse -Filter 'browsphere-core.exe' -File)
          if ($installed.Count -ne 1) { throw 'Expected exactly one installed Browsphere executable.' }
          Assert-TrustedSignature $installed[0].FullName
          $uninstallers = @(Get-ChildItem -LiteralPath $installRoot -Recurse -File |
            Where-Object { $_.Name -match '^uninstall(?:er)?(?:\s.*)?\.exe$' })
          if ($uninstallers.Count -ne 1) { throw 'Signed release is missing its NSIS uninstaller.' }
          $removed = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -PassThru -Wait
          if ($removed.ExitCode -ne 0 -or (Test-Path -LiteralPath $installed[0].FullName)) {
            throw 'Signed release could not be uninstalled cleanly.'
          }
          Write-Host 'RELEASE_INTEGRITY_PASS: trusted installer, embedded executable and clean uninstall.'
          [ordered]@{
            gate = 'signed-release-integrity'
            passed = $true
            commit = $env:GITHUB_SHA
            tag = $env:RELEASE_TAG
            issuer_thumbprint = $expected
            installer_sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
            embedded_app_sha256 = (Get-FileHash -LiteralPath $appExe -Algorithm SHA256).Hash
            signed_inner_executable = $true
            installed_executable_verified = $true
            clean_uninstall = $true
            updater_verified = $false
            limitations = 'Signing credentials and CI environment required. Automatic Tauri updater is disabled and untested.'
          } | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'browsphere-release-integrity.json') -Encoding UTF8

      - name: Remove ephemeral signing certificate and overlay
        if: always()
        shell: pwsh
        run: |
          $thumbprint = $env:BROWSPHERE_SIGNER_THUMBPRINT
          if ($thumbprint -match '^[0-9A-F]{40}$') {
            Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $thumbprint) -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath 'src-tauri/tauri.signing.release.conf.json' -Force -ErrorAction SilentlyContinue

      - name: Upload verified release integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: Browsphere-Signed-Release-Integrity
          path: ${{ runner.temp }}/browsphere-release-integrity.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified signed installer
        uses: actions/upload-artifact@v4
        with:
          name: Browsphere-Signed-Windows-Setup
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed installer (explicit opt-in)
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $remoteTag = git ls-remote --tags origin ("refs/tags/" + $env:RELEASE_TAG)
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing remote release tags.' }
          if ($remoteTag) { throw 'Release tag already exists; refusing to overwrite or reuse it.' }
          if (gh release view $env:RELEASE_TAG 2>$null) {
            throw 'Release already exists; refusing to overwrite published assets.'
          }
          $installer = Get-ChildItem 'target/release/bundle/nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Verified installer missing.' }
          gh release create $env:RELEASE_TAG $installer.FullName --target $env:GITHUB_SHA --title ("Browsphere " + $env:RELEASE_TAG) --notes "Signed Windows installer. Authenticode signature verified in CI. Automatic updater is not yet enabled."
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
