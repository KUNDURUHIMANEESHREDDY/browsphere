name: Windows CI — Test and Build Installer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies and compile CSS
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build:css

      - name: Validate frontend scripts
        shell: pwsh
        run: |
          node --check ui/public/src/tauri-bridge.js
          node --check ui/public/src/voice-agent.js
          node --check ui/public/src/browser-state.js
          node --check tests/e2e/lucia-youtube-search.cjs
          node --check tests/e2e/lucia-failure-recovery.cjs
          node --check tests/e2e/lucia-start-page-navigation.cjs
          node --check tests/e2e/lucia-local-model-server.cjs
          node --check tests/e2e/lucia-multistep-mock.cjs
          Get-ChildItem tests -Filter *.test.cjs | ForEach-Object { node --test $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Run Rust safety and regression tests
        run: cargo test --workspace --locked

      - name: Build Windows NSIS installer
        id: installer_build
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
          args: --bundles nsis

      - name: Run isolated native Lucia multi-step and recovery E2E
        shell: pwsh
        timeout-minutes: 8
        run: ./tests/e2e/run-lucia-multistep.ps1

      - name: Run cloud-only Lucia WebView2 E2E through OpenAI-compatible endpoint
        shell: pwsh
        timeout-minutes: 8
        run: ./tests/e2e/run-lucia-multistep.ps1 -CloudCompat -CdpPort 9274 -ModelPort 18769 -FixturePort 18770

      - name: Verify installer artifact exists
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path target/release/bundle/nsis -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue
          if (-not $files) { throw 'No NSIS setup.exe was produced' }
          $files | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }

      - name: Upload Windows installer (unsigned test artifact)
        # Preserve the compiled installer when an unrelated native E2E gate
        # fails; its presence is NOT evidence that the release was accepted.
        if: always() && steps.installer_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Browsphere-Windows-Installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
