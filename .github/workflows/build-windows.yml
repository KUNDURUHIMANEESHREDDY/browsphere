name: Build Standalone Windows Installer (setup.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install UI dependencies
        working-directory: ui
        run: |
          npm install --no-audit --no-fund
          npm run build:css

      - name: Build Tauri v2 Windows setup.exe & MSI
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          args: --bundles nsis

      - name: Upload standalone Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Browsphere-Windows-Installers
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
