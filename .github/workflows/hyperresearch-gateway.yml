name: Hyperresearch gateway regression checks

on:
  pull_request:
    paths:
      - 'tools/hyperresearch_*.py'
      - 'tests/test_hyperresearch_gateway.py'
      - '.github/workflows/hyperresearch-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'tools/hyperresearch_*.py'
      - 'tests/test_hyperresearch_gateway.py'

permissions:
  contents: read

jobs:
  gateway-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax of gateway and tests
        run: python -m py_compile tools/hyperresearch_gateway_core.py tools/hyperresearch_readonly_gateway.py tests/test_hyperresearch_gateway.py
      - name: Run bounded-response security tests
        run: python -m unittest discover -s tests -p 'test_hyperresearch_gateway.py' -v
