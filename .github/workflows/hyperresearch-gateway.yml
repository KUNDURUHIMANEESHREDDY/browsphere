name: Hyperresearch gateway regression checks

on:
  pull_request:
    paths:
      - 'tools/hyperresearch_*.py'
      - 'tests/test_hyperresearch_*.py'
      - 'tests/run_hyperresearch_rust_ci.py'
      - 'tests/e2e/seed_hyperresearch_webview_vault.py'
      - 'tests/e2e/lucia-hyperresearch-chatbox.cjs'
      - 'tests/e2e/run-hyperresearch-webview.ps1'
      - 'src-tauri/src/agent/mcp.rs'
      - 'src-tauri/src/agent/loop_runner.rs'
      - '.github/workflows/hyperresearch-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'tools/hyperresearch_*.py'
      - 'tests/test_hyperresearch_*.py'
      - 'tests/run_hyperresearch_rust_ci.py'
      - 'tests/e2e/seed_hyperresearch_webview_vault.py'
      - 'tests/e2e/lucia-hyperresearch-chatbox.cjs'
      - 'tests/e2e/run-hyperresearch-webview.ps1'
      - 'src-tauri/src/agent/mcp.rs'
      - 'src-tauri/src/agent/loop_runner.rs'

concurrency:
  group: hyperresearch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned real Hyperresearch MCP runtime
        run: python -m pip install "hyperresearch==0.13.3" "mcp>=1.8,<2"
      - name: Verify syntax of gateway and tests
        run: python -m py_compile tools/hyperresearch_gateway_core.py tools/hyperresearch_readonly_gateway.py tests/test_hyperresearch_gateway.py tests/test_hyperresearch_mcp_live.py
      - name: Run bounded-response security tests
        run: python -m unittest discover -s tests -p 'test_hyperresearch_gateway.py' -v
      - name: Run real local Hyperresearch MCP transport test
        run: python -m unittest discover -s tests -p 'test_hyperresearch_mcp_live.py' -v

  windows-native-mcp:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Prepare Tauri UI assets
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build:css
      - name: Install real Hyperresearch MCP runtime
        run: python -m pip install "hyperresearch==0.13.3" "mcp>=1.8,<2"
      - name: Native Lucia client against actual Hyperresearch server
        run: python tests/run_hyperresearch_rust_ci.py
      - name: Compile release executable for native WebView2 acceptance
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Hyperresearch chatbox plus original-source WebView2 acceptance
        shell: pwsh
        timeout-minutes: 8
        run: ./tests/e2e/run-hyperresearch-webview.ps1
