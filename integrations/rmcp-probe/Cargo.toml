[package]
name = "browsphere-rmcp-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone acceptance probe: intentionally outside Browsphere's production Cargo
# workspace until the official SDK can replace the existing transport safely.
[workspace]

[dependencies]
anyhow = "1.0"
rmcp = { version = "=3.12.0", default-features = false, features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1.0"
url = "2.5"
