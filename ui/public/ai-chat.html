<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucia</title>
  <link rel="stylesheet" href="./src/tailwind.css" />
  <link rel="stylesheet" href="./src/lucia-brand.css" />
  <link rel="stylesheet" href="./src/lucia-window.css" />
  <link rel="stylesheet" href="./src/lucia-shell.css" />
</head>
<body>
  <div class="shell lucia-shell">
    <!-- Native macOS-style window bar: each dot has an actual action. -->
    <header id="aiChatHeader" class="lucia-header">
      <div class="lucia-traffic">
        <button type="button" id="btnClose" class="traffic-close" title="Close Lucia" aria-label="Close Lucia"></button>
        <button type="button" id="btnMinimize" class="traffic-hide" title="Hide Lucia" aria-label="Hide Lucia"></button>
        <button type="button" id="btnDock" class="traffic-dock" title="Dock Lucia to browser" aria-label="Dock Lucia to browser"></button>
      </div>
      <div class="lucia-titlebar">
        <div class="lucia-wordmark">
          <svg class="lucia-wave-logo" viewBox="0 0 24 24" fill="none" role="img" aria-label="Lucia voice">
            <rect x="2" y="9" width="3" height="7" rx="1.5" fill="#577FFB"/>
            <rect x="7" y="5" width="3" height="15" rx="1.5" fill="#6987FF"/>
            <rect x="12" y="2" width="3" height="20" rx="1.5" fill="#A277F5"/>
            <rect x="17" y="7" width="3" height="11" rx="1.5" fill="#BA87EA"/>
          </svg>
          <strong>Lucia</strong>
        </div>
        <span class="lucia-header-separator" aria-hidden="true"></span>
        <div class="lucia-context" title="Current browsing context">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13.5a5 5 0 0 0 7.5.6l2.6-2.6a5 5 0 0 0-7.1-7.1L11.5 6"/>
            <path d="M14 10.5a5 5 0 0 0-7.5-.6L3.9 12.5A5 5 0 1 0 11 19.6l1.5-1.5"/>
          </svg>
          <span class="lucia-context-text" id="chatContextPill">Active page</span>
        </div>
        <div class="flex-1"></div>
        <button type="button" id="btnVoiceAgent" class="lucia-icon-action lucia-voice-agent-button"
          data-browsphere-voice-agent aria-label="Start Lucia Voice Agent" aria-pressed="false"
          title="Voice Agent · speak replies to queries">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
            <path d="M2 10v4M6 7v10M10 3v18M14 6v12M18 9v6M22 11v2"/>
          </svg>
        </button>
        <button type="button" id="btnNew" class="lucia-icon-action" title="New conversation" aria-label="New conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="lucia-stage">
      <div id="chatMessagesStream" class="lucia-stream">
        <div id="luciaEmptyState" class="lucia-welcome">
          <button type="button" id="btnVoiceOrb" class="lucia-orb"
            data-browsphere-voice-agent aria-label="Start Lucia Voice Agent" aria-pressed="false"
            title="Start or stop Voice Agent">
            <svg class="lucia-orb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
              <path d="M3 10v4M7 6v12M11 3v18M15 6v12M19 10v4"/>
            </svg>
          </button>
          <h1 id="emptyHeading">Lucia</h1>
          <p>Your AI browsing partner.</p>
        </div>
      </div>
    </main>

    <footer class="lucia-composer-area">
      <form id="chatComposerForm" class="lucia-composer">
        <input id="chatPromptInput" type="text" autocomplete="off" class="lucia-text-input"
          placeholder="Ask anything, browse, or give a task…" aria-label="Ask Lucia" maxlength="8000"/>
        <button type="button" id="btnVoiceSettings" class="lucia-icon-action" title="Voice settings" aria-label="Voice settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/>
            <path d="M19.2 13.7l1.1.9-1.5 2.7-1.4-.4a8.6 8.6 0 0 1-1.6.9l-.3 1.5h-3l-.4-1.5a8 8 0 0 1-1.7-.9l-1.4.4-1.5-2.7 1.1-.9a8.9 8.9 0 0 1 0-1.9l-1.1-.9 1.5-2.7 1.4.4a8.6 8.6 0 0 1 1.7-.9l.4-1.5h3l.3 1.5c.6.2 1.1.5 1.6.9l1.4-.4 1.5 2.7-1.1.9a8.9 8.9 0 0 1 0 1.9Z" transform="translate(-1.6 -1.2)"/>
          </svg>
        </button>
        <button type="button" id="btnVoice" class="lucia-mic" title="Dictate and send a query" aria-label="Dictate and send a query">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="2.5" width="6" height="12" rx="3"/>
            <path d="M5.5 10.5v2a6.5 6.5 0 0 0 13 0v-2M12 19v3M8 22h8"/>
          </svg>
        </button>
        <button type="submit" id="btnSend" class="lucia-send" title="Send" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.5 3.2a1 1 0 0 0-1.34 1.18L5.1 11l8.55 1-8.55 1-2.94 6.62a1 1 0 0 0 1.34 1.18L21.7 12.9a1 1 0 0 0 0-1.8L3.5 3.2Z"/></svg>
        </button>
      </form>
      <div id="browsphereVoiceStatus" class="lucia-live-status" role="status" aria-live="polite" data-idle="true">Ready</div>
    </footer>
  </div>

  <script src="./src/lucia-shell.js"></script>
  <script src="./src/voice-agent.js"></script>
</body>
</html>
